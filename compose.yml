name: kiln-infra-factory

services:
  toolbox:
    image: kiln-infra-toolbox:2026.11.15
    build:
      context: docker/toolbox
    working_dir: /workspace
    environment:
      ANSIBLE_CONFIG: /workspace/ansible/ansible.cfg
      TF_PLUGIN_CACHE_DIR: /workspace/.terraform-plugin-cache
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
    volumes:
      - .:/workspace
      - type: bind
        source: ${ANSIBLE_KEY_DIR:-./.no-ansible-key-dir}
        target: /run/ansible-keys
        read_only: true

  emulator:
    image: kiln-infra-moto:5.2.5
    build:
      context: .
      dockerfile: docker/emulator/Dockerfile
    # No Docker socket: Moto stores Lambda functions but does not run them. compose.lambda.yml is the
    # opt-in override for scripts/lambda-sqs-e2e.sh. See ADR 0001.
    environment:
      MOTO_PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"

  swtpm:
    image: kiln-infra-swtpm:0.7.1
    build:
      context: .
      dockerfile: docker/swtpm/Dockerfile
    volumes:
      - swtpm-state:/var/lib/swtpm

  rocky-target-1:
    build:
      context: docker/rocky-target
    environment:
      ANSIBLE_AUTHORIZED_KEY: ${ANSIBLE_PUBLIC_KEY:-}

  rocky-target-2:
    build:
      context: docker/rocky-target
    environment:
      ANSIBLE_AUTHORIZED_KEY: ${ANSIBLE_PUBLIC_KEY:-}

  ocsp:
    image: kiln-infra-toolbox:2026.11.15
    working_dir: /workspace
    command: ["bash", "pki/scripts/ocsp-responder.sh", "foreground"]
    environment:
      PKI_HOME: /pki
    ports:
      - "127.0.0.1:2560:2560"
    # Only public data and the OCSP signing pair. No CA private key and no other leaf key is mounted.
    volumes:
      - .:/workspace:ro
      - pki-public:/pki/public:ro
      - type: volume
        source: pki-issued
        target: /pki/issued/ocsp
        read_only: true
        volume:
          subpath: ocsp

  # Local-only. Mounts the Docker socket to create a kind cluster on the host daemon.
  kind-runner:
    image: kiln-infra-kind-runner:0.29.0
    build:
      context: docker/kind-runner
    profiles: ["kind"]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  swtpm-state:
  pki-root:
    name: kiln-pki-root
  pki-intermediate:
    name: kiln-pki-intermediate
  pki-public:
    name: kiln-pki-public
  pki-issued:
    name: kiln-pki-issued
