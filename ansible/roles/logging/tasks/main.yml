- name: Install rsyslog
  ansible.builtin.dnf:
    name: rsyslog
    state: present

- name: Install rsyslog configuration
  ansible.builtin.copy:
    src: 50-kiln.conf
    dest: /etc/rsyslog.d/50-kiln.conf
    owner: root
    group: root
    mode: "0644"

- name: Validate rsyslog configuration
  ansible.builtin.command: /usr/sbin/rsyslogd -N1
  changed_when: false
