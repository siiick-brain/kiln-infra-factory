- name: Install SSH hardening settings
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-kiln-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AllowUsers ansible
      X11Forwarding no
    owner: root
    group: root
    mode: "0600"
  notify: Reload sshd

- name: Validate SSH daemon configuration
  ansible.builtin.command: /usr/sbin/sshd -t -f /etc/ssh/sshd_config
  changed_when: false

- name: Read effective SSH daemon configuration
  ansible.builtin.command: /usr/sbin/sshd -T -f /etc/ssh/sshd_config
  changed_when: false
  register: ssh_hardening_effective_config

- name: Require hardened SSH settings
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in ssh_hardening_effective_config.stdout"
      - "'passwordauthentication no' in ssh_hardening_effective_config.stdout"
      - "'pubkeyauthentication yes' in ssh_hardening_effective_config.stdout"
      - "'allowusers ansible' in ssh_hardening_effective_config.stdout"
      - "'x11forwarding no' in ssh_hardening_effective_config.stdout"
    fail_msg: Effective sshd configuration does not match the hardening policy.

- name: Apply SSH configuration changes
  ansible.builtin.meta: flush_handlers
