- name: Install dnf-automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

# An earlier version inserted a block above the default keys. dnf-automatic reads the last value of a
# duplicated key, so the defaults won. Remove that block so each key appears once.
- name: Remove the superseded update settings block
  ansible.builtin.blockinfile:
    path: /etc/dnf/automatic.conf
    marker: "# {mark} ANSIBLE MANAGED KILN UPDATE SETTINGS"
    state: absent

- name: Set security-only automatic updates in the commands section
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: '^{{ item.key }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
    insertafter: '^\[commands\]$'
    owner: root
    group: root
    mode: "0644"
  loop:
    - { key: upgrade_type, value: security }
    - { key: download_updates, value: "yes" }
    - { key: apply_updates, value: "yes" }
    - { key: random_sleep, value: "0" }
  loop_control:
    label: "{{ item.key }}"
