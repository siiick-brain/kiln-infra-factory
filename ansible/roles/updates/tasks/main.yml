- name: Install dnf-automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

- name: Configure security-only automatic updates
  ansible.builtin.blockinfile:
    path: /etc/dnf/automatic.conf
    insertafter: '^\[commands\]$'
    marker: "# {mark} ANSIBLE MANAGED KILN UPDATE SETTINGS"
    block: |
      upgrade_type = security
      download_updates = True
      apply_updates = True
      random_sleep = 0
    owner: root
    group: root
    mode: "0644"
