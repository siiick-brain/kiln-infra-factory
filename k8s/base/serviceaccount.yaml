# The annotation binds this Kubernetes service account to a Google service account through GKE workload identity.
# On kind the annotation has no effect. It is validated by policy only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: kiln-demo
  annotations:
    iam.gke.io/gcp-service-account: kiln-web@kiln-demo-project.iam.gserviceaccount.com
automountServiceAccountToken: false
