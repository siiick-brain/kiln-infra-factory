name: Encrypted example

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sops:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned SOPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sopsPath = Join-Path $env:RUNNER_TEMP 'sops.exe'
          curl.exe -fsSL --retry 2 'https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.amd64.exe' -o $sopsPath
          if ($LASTEXITCODE -ne 0) {
            throw 'SOPS download failed.'
          }
          $actualHash = (Get-FileHash -LiteralPath $sopsPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne 'a4a9a398858fe8b2ef72d9686d930bf7c5cece9be74ad83ac3b53cfdd70e6b1c') {
            throw 'SOPS checksum did not match the pinned release.'
          }

      - name: Verify decryption requires the demo key
        shell: pwsh
        env:
          SOPS_AGE_KEY: ${{ secrets.DEMO_AGE_KEY }}
        run: .\tests\test_sops.ps1 -SopsPath "$env:RUNNER_TEMP\sops.exe"
